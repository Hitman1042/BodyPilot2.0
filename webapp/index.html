<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>BodyPilot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" v-cloak>

    <!-- Экран 401: нет авторизации -->
    <div v-if="authError" class="auth-screen">
        <div class="auth-emoji">🤖</div>
        <h1>BodyPilot</h1>
        <p>Открой приложение через кнопку в боте<br><b>@BodyPilot2_bot</b></p>
    </div>

    <!-- Онбординг: профиль ещё не создан -->
    <div v-else-if="onboardingRequired" class="onboarding-screen">
        <template v-if="onboardingStep === 'done'">
            <div class="auth-emoji">🎉</div>
            <h1>Добро пожаловать!</h1>
            <p>Профиль готов. Твоя цель: <b>{{ onboardingResult.computed.daily_calorie_goal }} ккал/день</b>.</p>
            <button class="btn btn-primary btn-block" @click="finishOnboarding">Начать пользоваться</button>
        </template>
        <template v-else>
            <div class="auth-emoji">🤖</div>
            <h1>BodyPilot</h1>
            <p class="hint onboarding-progress">Шаг {{ onboardingStep + 1 }} из 8</p>
            <div class="card onboarding-card">
                <template v-if="onboardingStep === 0">
                    <h2>Как тебя зовут?</h2>
                    <input v-model.trim="onboardingForm.username" class="input" maxlength="100" placeholder="Имя" @keyup.enter="nextOnboarding">
                </template>
                <template v-else-if="onboardingStep === 1">
                    <h2>Твой пол</h2>
                    <div class="choice-grid">
                        <button class="btn choice" :class="{selected: onboardingForm.gender === 'male'}" @click="onboardingForm.gender = 'male'">Мужской</button>
                        <button class="btn choice" :class="{selected: onboardingForm.gender === 'female'}" @click="onboardingForm.gender = 'female'">Женский</button>
                    </div>
                </template>
                <template v-else-if="onboardingStep === 2">
                    <h2>Сколько тебе лет?</h2>
                    <input v-model.number="onboardingForm.age" class="input" type="number" min="10" max="120" inputmode="numeric" placeholder="Возраст" @keyup.enter="nextOnboarding">
                </template>
                <template v-else-if="onboardingStep === 3">
                    <h2>Твой рост</h2>
                    <input v-model.number="onboardingForm.height_cm" class="input" type="number" min="81" max="299" inputmode="decimal" placeholder="Сантиметры" @keyup.enter="nextOnboarding">
                </template>
                <template v-else-if="onboardingStep === 4">
                    <h2>Твой вес</h2>
                    <input v-model.number="onboardingForm.weight_kg" class="input" type="number" min="21" max="499" step="0.1" inputmode="decimal" placeholder="Килограммы" @keyup.enter="nextOnboarding">
                </template>
                <template v-else-if="onboardingStep === 5">
                    <h2>Какая цель?</h2>
                    <div class="choice-list">
                        <button class="btn choice" :class="{selected: onboardingForm.goal === 'lose'}" @click="onboardingForm.goal = 'lose'">Похудеть</button>
                        <button class="btn choice" :class="{selected: onboardingForm.goal === 'maintain'}" @click="onboardingForm.goal = 'maintain'">Сохранить вес</button>
                        <button class="btn choice" :class="{selected: onboardingForm.goal === 'gain'}" @click="onboardingForm.goal = 'gain'">Набрать массу</button>
                    </div>
                </template>
                <template v-else-if="onboardingStep === 6">
                    <h2>Твоя активность</h2>
                    <div class="choice-list">
                        <button class="btn choice" :class="{selected: onboardingForm.activity === 'sedentary'}" @click="onboardingForm.activity = 'sedentary'">Низкая</button>
                        <button class="btn choice" :class="{selected: onboardingForm.activity === 'moderate'}" @click="onboardingForm.activity = 'moderate'">Средняя</button>
                        <button class="btn choice" :class="{selected: onboardingForm.activity === 'high'}" @click="onboardingForm.activity = 'high'">Высокая</button>
                    </div>
                </template>
                <template v-else>
                    <h2>Ещё немного деталей</h2>
                    <p class="hint">Можно пропустить и заполнить позже.</p>
                    <label class="form-label">Аллергии</label>
                    <input v-model.trim="onboardingForm.allergies" class="input" maxlength="500" placeholder="Например, орехи">
                    <label class="form-label">Город</label>
                    <input v-model.trim="onboardingForm.city" class="input" maxlength="100" placeholder="Город">
                    <label class="form-label">Время утреннего дайджеста</label>
                    <input v-model="onboardingForm.preferred_time" class="input" type="time">
                </template>
                <div class="sheet-row onboarding-actions">
                    <button v-if="onboardingStep > 0" class="btn" :disabled="onboardingSaving" @click="onboardingStep -= 1">Назад</button>
                    <button v-if="onboardingStep === 7" class="btn" :disabled="onboardingSaving" @click="completeOnboarding">Пропустить остальное</button>
                    <button class="btn btn-primary" :disabled="onboardingSaving" @click="nextOnboarding">
                        {{ onboardingSaving ? 'Сохраняю…' : (onboardingStep === 7 ? 'Готово' : 'Дальше') }}
                    </button>
                </div>
            </div>
        </template>
    </div>

    <div v-else-if="initializing" class="auth-screen">
        <div class="skeleton-wrap onboarding-loading"><div class="skeleton sk-card"></div></div>
    </div>

    <template v-else>
        <!-- Баннер потери связи -->
        <div v-if="offline" class="offline-banner">
            <span>📡 Нет связи, попробуй ещё</span>
            <button class="btn btn-small" @click="retryLast">Повторить</button>
        </div>

        <!-- Шапка -->
        <header class="app-header">
            <div class="header-title">BodyPilot <span v-if="profile && profile.is_premium" class="badge-premium">PRO</span></div>
            <div class="header-right">
                <span v-if="profile && profile.streak" class="header-streak">🔥 {{ profile.streak }}</span>
                <button v-if="profile && profile.is_admin" class="settings-btn" title="Админка" @click="openAdmin">🔧</button>
                <button class="settings-btn" title="Настройки профиля" @click="openSettings">⚙️</button>
            </div>
        </header>

        <main class="content">

            <!-- ════════ Вкладка: День ════════ -->
            <section v-show="tab === 'day'">
                <div class="greeting">
                    <h2>{{ greeting }}, {{ displayName }}! 👋</h2>
                    <p class="hint">{{ todayLabel }}</p>
                </div>

                <div v-if="loading.day" class="skeleton-wrap">
                    <div class="skeleton sk-card"></div>
                    <div class="skeleton sk-card"></div>
                </div>

                <template v-else>
                    <!-- КБЖУ -->
                    <div class="card">
                        <div class="card-title">🍎 Питание сегодня</div>
                        <div v-if="nutrition" class="kbju">
                            <div class="ring-wrap">
                                <svg class="ring" viewBox="0 0 120 120">
                                    <circle class="ring-bg" cx="60" cy="60" r="52"/>
                                    <circle class="ring-fg" :class="{over: calOver}" cx="60" cy="60" r="52"
                                            :stroke-dasharray="ringDash" transform="rotate(-90 60 60)"/>
                                </svg>
                                <div class="ring-text">
                                    <b>{{ fmt(nutrition.total_calories) }}</b>
                                    <span v-if="nutrition.target_calories">/ {{ fmt(nutrition.target_calories) }} ккал</span>
                                    <span v-else>ккал</span>
                                </div>
                            </div>
                            <div class="macros">
                                <div class="macro" v-for="m in macroBars" :key="m.label">
                                    <div class="macro-head">
                                        <span>{{ m.label }}</span>
                                        <span>{{ fmt(m.value) }}<template v-if="m.target"> / {{ fmt(m.target) }}</template> г</span>
                                    </div>
                                    <div class="bar"><div class="bar-fill" :style="{width: m.pct + '%'}"
                                         :class="{over: m.target && m.value > m.target}"></div></div>
                                </div>
                            </div>
                        </div>
                        <div v-if="nutrition && !nutrition.meals_count" class="empty">
                            Напиши боту, что съел — появится здесь 🤖
                        </div>
                    </div>

                    <!-- Вода -->
                    <div class="card">
                        <div class="card-title">💧 Вода</div>
                        <div v-if="water" class="water-row">
                            <div class="water-info">
                                <b>{{ water.amount_ml }}</b> / {{ water.target_ml }} мл
                                <div class="bar"><div class="bar-fill water"
                                     :style="{width: pct(water.amount_ml, water.target_ml) + '%'}"></div></div>
                            </div>
                            <div class="water-btns">
                                <button class="btn" @click="addWater(250)">+250</button>
                                <button class="btn" @click="addWater(500)">+500</button>
                            </div>
                        </div>
                    </div>

                    <!-- Активность с часов -->
                    <div class="card">
                        <div class="card-title">⌚ Активность
                            <button class="btn btn-small" @click="activityOpen = true">＋ Записать</button>
                        </div>
                        <ul class="ex-list" v-if="hasHealthData">
                            <li v-if="health.steps_today != null">
                                <span>👟 Шаги сегодня</span>
                                <span class="hint">{{ fmt(health.steps_today) }}</span>
                            </li>
                            <li v-if="health.sleep_last_night != null">
                                <span>😴 Сон прошлой ночью</span>
                                <span class="hint">{{ fmt(health.sleep_last_night) }} ч</span>
                            </li>
                            <li v-if="health.resting_hr_today != null">
                                <span>❤️ Пульс покоя</span>
                                <span class="hint">{{ fmt(health.resting_hr_today) }} уд/мин</span>
                            </li>
                        </ul>
                        <div v-else class="hint">Шаги, сон и пульс можно записать вручную — кнопка «＋ Записать».</div>
                    </div>

                    <!-- Тренировка дня -->
                    <div class="card">
                        <div class="card-title">🏋️ Тренировка дня</div>
                        <template v-if="workoutToday && workoutToday.exercises && workoutToday.exercises.length">
                            <div class="chips">
                                <span v-for="mod in workoutModules" :key="mod.key" class="chip">{{ mod.emoji }} {{ mod.title }}</span>
                            </div>
                            <ul class="ex-list">
                                <li v-for="ex in workoutToday.exercises.slice(0, 3)" :key="ex.sort_order || ex.exercise_id">
                                    <span>{{ ex.name }}</span>
                                    <span class="hint">{{ exScheme(ex) }}</span>
                                </li>
                            </ul>
                            <div class="hint" v-if="workoutToday.exercises.length > 3">
                                и ещё {{ workoutToday.exercises.length - 3 }} — смотри во вкладке «Планы»
                            </div>
                        </template>
                        <div v-else class="empty">Сегодня без тренировки. Отдохни или напиши боту 💪</div>
                    </div>
                </template>
            </section>

            <!-- ════════ Вкладка: Дневник ════════ -->
            <section v-show="tab === 'diary'">
                <div class="date-switch">
                    <button class="btn btn-small" @click="shiftDiaryDate(-1)">◀</button>
                    <div class="date-label">{{ diaryDateLabel }}</div>
                    <button class="btn btn-small" :disabled="diaryIsToday" @click="shiftDiaryDate(1)">▶</button>
                </div>

                <div v-if="loading.diary" class="skeleton-wrap">
                    <div class="skeleton sk-card"></div>
                    <div class="skeleton sk-card"></div>
                </div>

                <template v-else>
                    <div v-if="!diaryEntries.length" class="card empty">
                        Записей пока нет.<br>Нажми «+ Добавить» или напиши боту, что съел 🍽
                    </div>

                    <div v-for="group in diaryGroups" :key="group.key" class="card">
                        <div class="card-title">{{ group.emoji }} {{ group.title }}
                            <span class="hint">· {{ fmt(group.calories) }} ккал</span>
                        </div>
                        <ul class="entry-list">
                            <li v-for="e in group.entries" :key="e.id" class="entry">
                                <div class="entry-main">
                                    <div class="entry-name">{{ e.product_name }}</div>
                                    <div class="hint">{{ fmt(e.weight_g) }} г · Б {{ fmt(e.protein_g) }} · Ж {{ fmt(e.fat_g) }} · У {{ fmt(e.carbs_g) }}</div>
                                </div>
                                <div class="entry-cal">{{ fmt(e.calories) }}<span class="hint"> ккал</span></div>
                                <button class="btn-del" title="Удалить" @click="askDelete(e)">✕</button>
                            </li>
                        </ul>
                    </div>

                    <div v-if="diaryEntries.length" class="card total-card">
                        <div class="card-title">Σ Итого за день</div>
                        <div class="total-row">
                            <span><b>{{ fmt(diaryTotals.calories) }}</b> ккал</span>
                            <span>Б {{ fmt(diaryTotals.protein_g) }}</span>
                            <span>Ж {{ fmt(diaryTotals.fat_g) }}</span>
                            <span>У {{ fmt(diaryTotals.carbs_g) }}</span>
                        </div>
                    </div>

                    <button class="btn btn-block" @click="openAddPanel">+ Добавить</button>
                </template>
            </section>

            <!-- ════════ Вкладка: Прогресс ════════ -->
            <section v-show="tab === 'progress'">
                <div v-if="loading.progress" class="skeleton-wrap">
                    <div class="skeleton sk-card"></div>
                    <div class="skeleton sk-card"></div>
                    <div class="skeleton sk-card"></div>
                </div>
                <template v-else>
                    <div class="card">
                        <div class="date-switch calendar-switch">
                            <button class="btn btn-small" @click="shiftCalendarMonth(-1)">◀</button>
                            <div class="date-label">{{ calendarTitle }}</div>
                            <button class="btn btn-small" @click="shiftCalendarMonth(1)">▶</button>
                        </div>
                        <div class="calendar-weekdays"><span v-for="d in ['Пн','Вт','Ср','Чт','Пт','Сб','Вс']" :key="d">{{ d }}</span></div>
                        <div class="activity-calendar" :class="{loading: calendarLoading}">
                            <div v-for="(cell, index) in calendarCells" :key="index" class="calendar-cell"
                                 :class="{empty: !cell, today: cell && cell.date === todayDate}">
                                <template v-if="cell">
                                    <span class="calendar-day">{{ Number(cell.date.slice(-2)) }}</span>
                                    <span class="calendar-icons">
                                        <i v-if="cell.has_food" :title="fmt(cell.calories) + ' ккал'">🍽</i>
                                        <i v-if="cell.has_workout">🏋️</i>
                                        <i v-if="cell.steps != null" :title="cell.steps + ' шагов'">👟</i>
                                        <i v-if="cell.water_ml > 0" :title="cell.water_ml + ' мл'">💧</i>
                                    </span>
                                </template>
                            </div>
                        </div>
                        <div class="calendar-legend">🍽 еда · 🏋️ тренировка · 👟 шаги · 💧 вода</div>
                    </div>

                    <div class="card">
                        <div class="card-title">🏆 Личные рекорды</div>
                        <ul v-if="topWeightRecords.length" class="ex-list">
                            <li v-for="r in topWeightRecords" :key="(r.exercise_id || 'custom') + r.name">
                                <span>{{ r.name }}</span>
                                <span class="hint">{{ fmt(r.max_weight_kg) }} кг · до {{ r.max_reps }} повт.</span>
                            </li>
                        </ul>
                        <div v-if="records && (records.session_tonnage || records.session_duration)" class="hint record-summary">
                            <template v-if="records.session_tonnage">Тоннаж: {{ fmt(records.session_tonnage.value_kg) }} кг</template>
                            <template v-if="records.session_duration"> · длительность: {{ records.session_duration.value_min }} мин</template>
                        </div>
                        <div v-if="records && (records.steps || records.protein)" class="hint record-summary">
                            <template v-if="records.steps">👟 {{ fmt(records.steps.value) }}</template>
                            <template v-if="records.protein"> · белок {{ fmt(records.protein.value_g) }} г</template>
                        </div>
                        <div v-if="!topWeightRecords.length && !(records && (records.steps || records.protein || records.session_tonnage || records.session_duration))" class="empty">Заверши тренировку — рекорды появятся здесь</div>
                    </div>

                    <div class="card">
                        <div class="card-title">📈 Форма и усталость, 8 недель</div>
                        <div v-if="freshness" class="hint freshness-line">
                            Fitness {{ fmt(freshness.fitness) }} · Fatigue {{ fmt(freshness.fatigue) }} · Freshness {{ fmt(freshness.freshness) }}<br>
                            {{ freshness.interpretation }}
                        </div>
                        <div v-if="loadCurves.length" class="chart-wrap"><canvas ref="loadChart"></canvas></div>
                        <div v-else class="empty">Нет данных о нагрузке</div>
                    </div>

                    <div class="card">
                        <div class="card-title">⚖️ Вес, 30 дней</div>
                        <div v-if="weightHistory.length" class="chart-wrap"><canvas ref="weightChart"></canvas></div>
                        <div v-else class="empty">Пока нет данных о весе. Напиши боту свой вес ⚖️</div>
                    </div>
                    <div class="card">
                        <div class="card-title">🔥 Калории, 7 дней</div>
                        <div v-if="nutritionSummary.length" class="chart-wrap"><canvas ref="calChart"></canvas></div>
                        <div v-else class="empty">Нет записей о питании за неделю</div>
                    </div>
                    <div class="card">
                        <div class="card-title">🏋️ Тренировки, 7 дней</div>
                        <div v-if="workoutHistory.length" class="chart-wrap"><canvas ref="workoutChart"></canvas></div>
                        <div v-else class="empty">Нет тренировок за неделю. Самое время начать! 💪</div>
                    </div>
                    <div class="card">
                        <div class="card-title">👟 Шаги, 14 дней</div>
                        <div v-if="healthSteps.length" class="chart-wrap"><canvas ref="stepsChart"></canvas></div>
                        <div v-else class="empty">Нет данных о шагах. Подключи часы или напиши боту /activity ⌚</div>
                    </div>
                    <div class="card">
                        <div class="card-title">😴 Сон, 14 дней</div>
                        <div v-if="healthSleep.length" class="chart-wrap"><canvas ref="sleepChart"></canvas></div>
                        <div v-else class="empty">Нет данных о сне за последние дни</div>
                    </div>

                    <!-- Челленджи -->
                    <div class="card">
                        <div class="card-title">🎯 Челленджи</div>
                        <div v-if="!challenges.length" class="empty">Челленджи загружаются…</div>
                        <div v-for="ch in challenges" :key="ch.code" class="challenge">
                            <div class="challenge-head">
                                <span class="challenge-name">{{ ch.name }}</span>
                                <span v-if="ch.status === 'completed'" class="badge-done">🏆 Выполнен</span>
                                <span v-else-if="ch.status === 'failed'" class="badge-fail">Провален</span>
                            </div>
                            <div class="hint">{{ ch.condition }}</div>
                            <template v-if="ch.status === 'active'">
                                <div class="bar challenge-bar">
                                    <div class="bar-fill" :style="{width: pct(ch.current, ch.target) + '%'}"></div>
                                </div>
                                <div class="hint">{{ ch.current }} / {{ ch.target }} {{ ch.unit }}</div>
                            </template>
                            <button v-if="ch.status === 'not_joined'" class="btn btn-small"
                                    :disabled="joiningCode === ch.code" @click="joinChallenge(ch.code)">
                                {{ joiningCode === ch.code ? '…' : 'Участвовать' }}
                            </button>
                        </div>
                    </div>

                    <!-- Друзья -->
                    <div class="card">
                        <div class="card-title">👥 Друзья</div>
                        <div v-if="!socialFeed.length" class="empty">
                            Пригласи друзей по своей ссылке — будет веселее!<br>
                            Здесь появятся их тренировки, рекорды и достижения.
                        </div>
                        <div v-for="item in socialFeed" :key="item.type + '_' + item.id" class="social-event">
                            <div><b>{{ item.from_username }}</b>: {{ item.text }}</div>
                            <div class="social-event-footer">
                                <span v-if="item.kudos_count" class="hint">👏 {{ item.kudos_count }}</span>
                                <button class="btn btn-small" :disabled="item.kudosed || kudosTarget === item.type + '_' + item.id"
                                        @click="giveKudos(item)">
                                    {{ item.kudosed ? '👏 Поддержано' : (kudosTarget === item.type + '_' + item.id ? '…' : '👏 Поддержать') }}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="card">
                        <div class="card-title">🎯 Челленджи с друзьями</div>
                        <div v-for="code in ['food_30', 'workout_12', 'calorie_week']" :key="'group_' + code" class="challenge">
                            <template v-if="groupChallenges[code]">
                                <div class="challenge-head">
                                    <span class="challenge-name">{{ groupChallenges[code].name }}</span>
                                    <button v-if="!groupChallenges[code].user_joined" class="btn btn-small"
                                            :disabled="joiningCode === code" @click="joinChallenge(code)">Участвовать</button>
                                </div>
                                <ul class="ex-list">
                                    <li v-for="p in groupChallenges[code].participants" :key="code + '_' + p.user_id">
                                        <span>{{ p.username }} <span v-if="p.status === 'not_joined'" class="hint">· не участвует</span></span>
                                        <span class="hint">{{ p.current }} / {{ p.target }} {{ groupChallenges[code].unit }}</span>
                                    </li>
                                </ul>
                            </template>
                        </div>
                    </div>

                    <!-- Фото прогресса -->
                    <div class="card">
                        <div class="card-title card-title-action">📸 Фото прогресса
                            <button class="btn btn-small" @click="openPhotoUpload">＋ Добавить фото</button>
                        </div>
                        <template v-if="photos.length">
                            <div v-if="photoDynamics" class="hint photo-dynamics">{{ photoDynamics }}</div>
                            <div class="photo-grid">
                                <div v-for="p in photos" :key="p.id" class="photo-cell" @click="photoViewer = p">
                                    <img v-if="p.url" :src="p.url" :alt="'Фото от ' + photoDate(p)" loading="lazy">
                                    <div v-else class="photo-loading">…</div>
                                </div>
                            </div>
                        </template>
                        <div v-else class="empty">Фото пока нет 📷</div>
                    </div>
                </template>
            </section>

            <!-- ════════ Вкладка: Коуч ════════ -->
            <section v-show="tab === 'coach'" class="coach-section">
                <div ref="chatBox" class="chat-box">
                    <div v-if="!chatMessages.length" class="empty chat-empty">
                        Привет! Я твой AI-коуч 🤖<br>
                        Спроси про питание, тренировки или напиши, что съел, — запишу в дневник.
                    </div>
                    <div v-for="(m, i) in chatMessages" :key="i" class="chat-msg"
                         :class="m.role === 'user' ? 'chat-user' : 'chat-coach'">
                        <div v-for="(t, j) in m.tools || []" :key="'t' + j" class="chat-tool">✅ {{ t }}</div>
                        <div class="chat-text">{{ m.text }}</div>
                    </div>
                    <div v-if="chatSending" class="chat-msg chat-coach">
                        <div class="chat-text hint">{{ voiceSending ? 'Распознаю голос и думаю…' : 'Коуч думает…' }}</div>
                    </div>
                </div>
                <div v-if="voiceRecording" class="voice-recorder">
                    <span class="voice-indicator">●</span>
                    <b>{{ voiceTime() }} / 1:00</b>
                    <button class="btn btn-small" @click="stopVoice(false)">Отмена</button>
                    <button class="btn btn-primary btn-small" @click="stopVoice(true)">Отправить</button>
                </div>
                <div v-else class="chat-input">
                    <button class="btn voice-btn" title="Голосовое сообщение" :disabled="chatSending" @click="startVoice">🎤</button>
                    <input v-model="chatInput" class="input" placeholder="Спроси коуча…"
                           maxlength="2000" :disabled="chatSending"
                           @keyup.enter="sendChat">
                    <button class="btn btn-primary chat-send" :disabled="chatSending || !chatInput.trim()"
                            @click="sendChat">➤</button>
                </div>
            </section>

            <!-- ════════ Вкладка: Планы ════════ -->
            <section v-show="tab === 'plans'">
                <div class="plans-head">
                    <button class="btn" @click="loadPlans">🔄 Обновить</button>
                </div>

                <div v-if="loading.plans" class="skeleton-wrap">
                    <div class="skeleton sk-card"></div>
                    <div class="skeleton sk-card"></div>
                </div>

                <template v-else>
                    <!-- План питания -->
                    <div class="card">
                        <div class="card-title">🍽 План питания на сегодня</div>
                        <template v-if="mealPlan && mealPlan.meals">
                            <div v-for="m in mealPlanList" :key="m.key" class="meal-plan-item">
                                <div class="meal-plan-head">
                                    <span>{{ m.emoji }} {{ m.title }}</span>
                                    <span class="hint">{{ fmt(m.item.cal) }} ккал</span>
                                </div>
                                <div class="meal-plan-name">{{ m.item.name }}</div>
                                <div class="hint">Б {{ fmt(m.item.p) }} · Ж {{ fmt(m.item.f) }} · У {{ fmt(m.item.c) }}</div>
                            </div>
                            <div class="total-row plan-total">
                                <span>Цель: <b>{{ fmt(mealPlan.calorie_target) }}</b> ккал</span>
                                <span>Б {{ fmt(mealPlan.macros_target.protein_g) }}</span>
                                <span>Ж {{ fmt(mealPlan.macros_target.fat_g) }}</span>
                                <span>У {{ fmt(mealPlan.macros_target.carbs_g) }}</span>
                            </div>
                        </template>
                        <div v-else-if="mealPlanError === 422" class="empty">
                            Заполни профиль в боте (рост, вес, возраст) — и получишь план 🍽
                        </div>
                        <div v-else class="empty">План питания пока недоступен</div>
                    </div>

                    <!-- План тренировки -->
                    <div class="card">
                        <div class="card-title">🏋️ План тренировки</div>
                        <template v-if="workoutPlan && workoutPlan.exercises && workoutPlan.exercises.length">
                            <div v-for="mod in workoutPlanModules" :key="mod.key" class="module">
                                <div class="module-title">{{ mod.emoji }} {{ mod.title }}</div>
                                <ul class="ex-list">
                                    <li v-for="ex in mod.items" :key="(ex.sort_order || 0) + '_' + (ex.exercise_id || ex.name)">
                                        <div>
                                            <div>{{ ex.name }}</div>
                                            <div class="hint" v-if="ex.note">{{ ex.note }}</div>
                                        </div>
                                        <span class="hint">{{ exScheme(ex) }}</span>
                                    </li>
                                </ul>
                            </div>
                        </template>
                        <div v-else class="empty">План тренировки пока недоступен. Напиши боту 💬</div>
                    </div>
                </template>
            </section>
        </main>

        <!-- Нижний таб-бар -->
        <nav class="tabbar">
            <button v-for="t in tabs" :key="t.key" class="tab" :class="{active: tab === t.key}"
                    @click="switchTab(t.key)">
                <span class="tab-emoji">{{ t.emoji }}</span>
                <span class="tab-label">{{ t.label }}</span>
            </button>
        </nav>

        <!-- Панель добавления продукта -->
        <div v-if="addPanel" class="sheet-backdrop" @click.self="closeAddPanel">
            <div class="sheet">
                <div class="card-title">➕ Добавить продукт</div>

                <div class="sheet-row">
                    <select v-model="addForm.meal_type" class="input">
                        <option value="breakfast">🍳 Завтрак</option>
                        <option value="lunch">🍲 Обед</option>
                        <option value="dinner">🌙 Ужин</option>
                        <option value="snack">🍎 Перекус</option>
                    </select>
                </div>

                <input v-model="searchQuery" class="input" placeholder="Поиск продукта…" @input="onSearchInput">

                <div v-if="searching" class="hint sheet-hint">Ищем…</div>
                <div v-else-if="searchQuery && !searchResults.length && searchDone" class="hint sheet-hint">Ничего не нашлось 🤷</div>

                <ul v-if="!selectedProduct" class="search-list">
                    <li v-for="p in searchResults" :key="p.id" @click="selectProduct(p)">
                        <div>
                            <div>{{ p.name }}</div>
                            <div class="hint">{{ p.category }}</div>
                        </div>
                        <span class="hint">{{ fmt(p.calories) }} ккал/100г</span>
                    </li>
                </ul>

                <div v-if="selectedProduct" class="picked">
                    <div class="picked-name">{{ selectedProduct.name }}</div>
                    <div class="hint">на 100 г: {{ fmt(selectedProduct.calories) }} ккал ·
                        Б {{ fmt(selectedProduct.protein_g) }} · Ж {{ fmt(selectedProduct.fat_g) }} · У {{ fmt(selectedProduct.carbs_g) }}</div>
                    <div class="sheet-row grams-row">
                        <input v-model.number="addForm.weight_g" class="input" type="number" min="1" max="10000"
                               inputmode="numeric" placeholder="Граммы">
                        <div class="picked-calc" v-if="addForm.weight_g > 0">
                            ≈ <b>{{ fmt(selectedProduct.calories * addForm.weight_g / 100) }}</b> ккал
                        </div>
                    </div>
                    <div class="sheet-row">
                        <button class="btn" @click="selectedProduct = null">← Назад</button>
                        <button class="btn btn-primary" :disabled="!addForm.weight_g || addForm.weight_g <= 0 || saving"
                                @click="saveEntry">{{ saving ? 'Сохраняю…' : 'Добавить' }}</button>
                    </div>
                </div>

                <button class="btn btn-block sheet-close" @click="closeAddPanel">Закрыть</button>
            </div>
        </div>

        <!-- Подтверждение удаления -->
        <div v-if="deleteTarget" class="sheet-backdrop" @click.self="deleteTarget = null">
            <div class="sheet sheet-confirm">
                <div class="card-title">Удалить запись?</div>
                <p>{{ deleteTarget.product_name }} — {{ fmt(deleteTarget.weight_g) }} г</p>
                <div class="sheet-row">
                    <button class="btn" @click="deleteTarget = null">Отмена</button>
                    <button class="btn btn-danger" :disabled="saving" @click="confirmDelete">Удалить</button>
                </div>
            </div>
        </div>

        <!-- Загрузка фото прогресса -->
        <div v-if="photoUploadOpen" class="sheet-backdrop" @click.self="closePhotoUpload">
            <div class="sheet">
                <div class="card-title">📸 Добавить фото прогресса</div>
                <input class="input photo-file-input" type="file" accept="image/*" @change="selectPhoto">
                <img v-if="photoPreview" :src="photoPreview" class="photo-upload-preview" alt="Превью фото">
                <label class="form-label">Вес, кг (необязательно)</label>
                <input v-model.number="photoForm.weight_kg" class="input" type="number" min="20" max="500" step="0.1" inputmode="decimal">
                <label class="form-label">Заметка (необязательно)</label>
                <textarea v-model="photoForm.note" class="input" maxlength="500" rows="3" placeholder="Например, первый месяц"></textarea>
                <div class="sheet-row">
                    <button class="btn" :disabled="photoUploading" @click="closePhotoUpload">Отмена</button>
                    <button class="btn btn-primary" :disabled="!photoFile || photoUploading" @click="uploadPhoto">
                        {{ photoUploading ? 'Загружаю…' : 'Загрузить' }}
                    </button>
                </div>
            </div>
        </div>

        <!-- Админка -->
        <div v-if="adminOpen" class="sheet-backdrop" @click.self="adminOpen = false">
            <div class="sheet admin-sheet">
                <div class="card-title">🔧 Админка</div>
                <label class="form-label">Админ-ключ</label>
                <div class="sheet-row admin-key-row">
                    <input v-model="adminKey" class="input" type="password" placeholder="X-Admin-Key" @keyup.enter="loadAdminMetrics">
                    <button class="btn btn-primary" :disabled="adminLoading" @click="loadAdminMetrics">Открыть</button>
                </div>
                <div v-if="adminLoading" class="skeleton sk-card"></div>
                <template v-if="adminMetrics">
                    <div class="admin-metrics">
                        <div><b>{{ adminMetrics.users_total }}</b><span>Пользователи</span></div>
                        <div><b>{{ adminMetrics.users_active_7d }}</b><span>Активные за 7 дней</span></div>
                        <div><b>{{ adminMetrics.food_entries_24h }}</b><span>Еда за 24 часа</span></div>
                        <div><b>{{ adminMetrics.ai_requests_24h }}</b><span>AI за 24 часа</span></div>
                        <div><b>{{ adminMetrics.ai_requests_total }}</b><span>Всего AI-запросов</span></div>
                        <div><b>{{ adminMetrics.premium_active }}</b><span>Активный Premium</span></div>
                    </div>
                    <div class="admin-grant">
                        <div class="card-title">Выдать Premium</div>
                        <label class="form-label">User ID</label>
                        <input v-model.number="adminForm.user_id" class="input" type="number" min="1" inputmode="numeric">
                        <label class="form-label">Дней</label>
                        <input v-model.number="adminForm.days" class="input" type="number" min="1" max="3650" inputmode="numeric">
                        <button class="btn btn-primary btn-block" :disabled="!adminForm.user_id || !adminForm.days || adminGranting" @click="grantPremium">
                            {{ adminGranting ? 'Выдаю…' : 'Выдать Premium' }}
                        </button>
                    </div>
                </template>
                <button class="btn btn-block sheet-close" @click="adminOpen = false">Закрыть</button>
            </div>
        </div>

        <!-- Настройки профиля -->
        <div v-if="settingsOpen" class="sheet-backdrop" @click.self="settingsOpen = false">
            <div class="sheet">
                <div class="card-title">⚙️ Профиль</div>
                <label class="form-label">Вес, кг</label>
                <input v-model.number="settingsForm.weight_kg" class="input" type="number"
                       min="20" max="500" step="0.1" inputmode="decimal">
                <label class="form-label">Рост, см</label>
                <input v-model.number="settingsForm.height_cm" class="input" type="number"
                       min="80" max="300" step="1" inputmode="decimal">
                <label class="form-label">Возраст</label>
                <input v-model.number="settingsForm.age" class="input" type="number"
                       min="10" max="120" step="1" inputmode="numeric">
                <label class="form-label">Цель</label>
                <select v-model="settingsForm.goal" class="input">
                    <option value="lose">Похудение</option>
                    <option value="maintain">Поддержание</option>
                    <option value="gain">Набор массы</option>
                </select>
                <label class="form-label">Активность</label>
                <select v-model="settingsForm.activity" class="input">
                    <option value="sedentary">Малоподвижная</option>
                    <option value="moderate">Умеренная</option>
                    <option value="high">Высокая</option>
                </select>
                <div class="sheet-row">
                    <button class="btn" @click="settingsOpen = false">Отмена</button>
                    <button class="btn btn-primary" :disabled="settingsSaving" @click="saveSettings">
                        {{ settingsSaving ? 'Сохраняю…' : 'Сохранить' }}
                    </button>
                </div>
            </div>
        </div>

        <!-- Форма записи активности -->
        <div v-if="activityOpen" class="sheet-backdrop" @click.self="activityOpen = false">
            <div class="sheet">
                <div class="card-title">⌚ Записать активность</div>
                <label class="form-label">Дата</label>
                <select v-model="activityForm.date" class="input">
                    <option value="today">Сегодня</option>
                    <option value="yesterday">Вчера</option>
                </select>
                <label class="form-label">Шаги</label>
                <input v-model.number="activityForm.steps" class="input" type="number"
                       min="1" max="100000" placeholder="например 8500" inputmode="numeric">
                <label class="form-label">Сон, часов</label>
                <input v-model.number="activityForm.sleep_hours" class="input" type="number"
                       min="0.5" max="24" step="0.5" placeholder="например 7.5" inputmode="decimal">
                <label class="form-label">Пульс покоя, уд/мин (необязательно)</label>
                <input v-model.number="activityForm.resting_heart_rate" class="input" type="number"
                       min="30" max="220" inputmode="numeric">
                <div class="sheet-row">
                    <button class="btn" @click="activityOpen = false">Отмена</button>
                    <button class="btn btn-primary" :disabled="activitySaving" @click="saveActivity">
                        {{ activitySaving ? 'Сохраняю…' : 'Сохранить' }}
                    </button>
                </div>
            </div>
        </div>

        <!-- Полноэкранный просмотр фото -->
        <div v-if="photoViewer" class="photo-viewer" @click="photoViewer = null">
            <img v-if="photoViewer.url" :src="photoViewer.url" alt="Фото прогресса">
            <div class="photo-viewer-caption">
                {{ photoDate(photoViewer) }}<template v-if="photoViewer.weight_kg"> · {{ fmt(photoViewer.weight_kg) }} кг</template>
                <template v-if="photoViewer.note"> · {{ photoViewer.note }}</template>
            </div>
        </div>

        <!-- Toast -->
        <transition name="toast">
            <div v-if="toast" class="toast">{{ toast }}</div>
        </transition>
    </template>
</div>

<script src="app.js"></script>
</body>
</html>
